# Sized for one 16 GB T4: fp16 (no bf16), LoRA, 4 prompts x G=8 per step.
grpo:
  learning_rate: 1.0e-5
  lr_scheduler_type: cosine
  warmup_ratio: 0.05
  max_grad_norm: 0.1
  optim: adamw_torch
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8   # 4 x 8 = 32 completions = 4 prompts x G=8
  max_prompt_length: 256
  max_completion_length: 320
  temperature: 0.8
  beta: 0.0                        # no KL term, no reference-model pass
  fp16: true
  bf16: false
  gradient_checkpointing: true
  logging_steps: 1
  save_steps: 50
  save_total_limit: 2
  log_completions: true
  report_to: wandb
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
